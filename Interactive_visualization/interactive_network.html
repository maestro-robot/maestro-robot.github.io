            style="display: none; position: fixed; top: 10px; left: 10px; background: #3b82f6; color: white; 
                   border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; z-index: 1000; font-size: 12px;">
        ⚙️ Show Controls
    </button>
    
    <script>
    const STORAGE_KEY = 'passingMapLayout';
    
    // Hardcoded default layout - curated by author for optimal visualization
    const DEFAULT_LAYOUT = {"estimate_feature_point":{"x":-779,"y":1024},"get_image":{"x":-1435,"y":761},"get_object_bbox":{"x":-789,"y":149},"get_position_from_labels":{"x":-783,"y":687},"naive_pointing":{"x":-789,"y":404},"rescan_wrist":{"x":-1460,"y":402},"scan_wrist":{"x":-1884,"y":562},"move_gripper_to":{"x":659,"y":575},"close_gripper":{"x":1187,"y":527},"open_gripper":{"x":-87,"y":506},"get_grasp_pose":{"x":429,"y":171},"plan_grasp":{"x":854,"y":169},"euler_to_rmat":{"x":198,"y":880},"measure_relative_rotation":{"x":-44,"y":862},"measure_vector":{"x":136,"y":1036},"rmat_to_euler":{"x":95,"y":808},"rotate_by":{"x":212,"y":767},"execute_with_pi05":{"x":-34,"y":99}};
    
    const workflows = [{"steps": ["scan_wrist", "get_image", "get_position_from_labels"], "count": 24, "label": "Scan Scene \u2192 Get Image \u2192 Gemini Pointing (24x)"}, {"steps": ["scan_wrist", "get_image", "get_position_from_labels", "open_gripper"], "count": 20, "label": "Scan Scene \u2192 Get Image \u2192 Gemini Pointing \u2192 Open Gripper (20x)"}, {"steps": ["scan_wrist", "get_image", "get_position_from_labels", "open_gripper", "get_grasp_pose", "move_gripper_to"], "count": 12, "label": "Scan Scene \u2192 Get Image \u2192 Gemini Pointing \u2192 Open Gripper \u2192 Grasp Generation \u2192 Move To (12x)"}, {"steps": ["scan_wrist", "get_image", "get_position_from_labels", "open_gripper", "move_gripper_to", "close_gripper"], "count": 8, "label": "Scan Scene \u2192 Get Image \u2192 Gemini Pointing \u2192 Open Gripper \u2192 Move To \u2192 Close Gripper (8x)"}, {"steps": ["scan_wrist", "get_image", "get_position_from_labels", "open_gripper", "get_grasp_pose", "move_gripper_to", "plan_grasp", "close_gripper"], "count": 7, "label": "Scan Scene \u2192 ... \u2192 Close Gripper (8 steps, 7x)"}, {"steps": ["scan_wrist", "get_image", "get_position_from_labels", "open_gripper", "get_grasp_pose", "move_gripper_to", "plan_grasp", "close_gripper", "move_gripper_to", "open_gripper"], "count": 6, "label": "Scan Scene \u2192 ... \u2192 Open Gripper (10 steps, 6x)"}, {"steps": ["scan_wrist", "get_image", "estimate_feature_point"], "count": 21, "label": "Scan Scene \u2192 Get Image \u2192 Keypoint Pointing (21x)"}, {"steps": ["scan_wrist", "get_image", "estimate_feature_point", "open_gripper"], "count": 13, "label": "Scan Scene \u2192 Get Image \u2192 Keypoint Pointing \u2192 Open Gripper (13x)"}, {"steps": ["scan_wrist", "get_image", "estimate_feature_point", "open_gripper", "move_gripper_to", "close_gripper"], "count": 7, "label": "Scan Scene \u2192 Get Image \u2192 Keypoint Pointing \u2192 Open Gripper \u2192 Move To \u2192 Close Gripper (7x)"}, {"steps": ["scan_wrist", "get_image", "naive_pointing", "get_object_bbox"], "count": 9, "label": "Scan Scene \u2192 Get Image \u2192 BBox Pointing \u2192 Get BBox (9x)"}, {"steps": ["scan_wrist", "get_image", "naive_pointing", "get_object_bbox", "open_gripper"], "count": 8, "label": "Scan Scene \u2192 Get Image \u2192 BBox Pointing \u2192 Get BBox \u2192 Open Gripper (8x)"}, {"steps": ["scan_wrist", "get_image", "naive_pointing", "get_object_bbox", "open_gripper", "move_gripper_to"], "count": 7, "label": "Scan Scene \u2192 Get Image \u2192 BBox Pointing \u2192 Get BBox \u2192 Open Gripper \u2192 Move To (7x)"}, {"steps": ["scan_wrist", "get_image", "execute_with_pi05"], "count": 5, "label": "Scan Scene \u2192 Get Image \u2192 VLA (\u03c00.5) (5x)"}];
    const shortNames = {"estimate_feature_point": "Keypoint Pointing", "get_image": "Get Image", "get_object_bbox": "Get BBox", "get_position_from_labels": "Gemini Pointing", "naive_pointing": "BBox Pointing", "rescan_wrist": "Rescan Scene", "scan_wrist": "Scan Scene", "move_gripper_to": "Move To", "close_gripper": "Close Gripper", "open_gripper": "Open Gripper", "get_grasp_pose": "Grasp Generation", "plan_grasp": "Grasp Planning", "euler_to_rmat": "Euler\u2192RotMat", "measure_relative_rotation": "Measure Rotation", "measure_vector": "Measure Vector", "rmat_to_euler": "RotMat\u2192Euler", "rotate_by": "Rotate", "execute_with_pi05": "VLA (\u03c00.5)"};
    
    // Store original node/edge data for reset (prefixed to avoid pyvis conflicts)
    let _savedNodes = [];
    let _savedEdges = [];
    let _isHighlighting = false;
    
    // Legend drag state
    let legendDragging = false;
    let legendOffsetX = 0, legendOffsetY = 0;
    
    function toggleControls() {
        const panel = document.getElementById('controlPanel');
        const btn = document.getElementById('showControlsBtn');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            btn.style.display = 'none';
        } else {
            panel.style.display = 'none';
            btn.style.display = 'block';
        }
    }
    
    function toggleLegend() {
        const panel = document.getElementById('legendPanel');
        const btn = document.getElementById('showLegendBtn');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            btn.style.display = 'none';
        } else {
            panel.style.display = 'none';
            btn.style.display = 'block';
        }
    }
    
    function startDragLegend(e) {
        if (e.target.tagName === 'BUTTON') return;
        legendDragging = true;
        const panel = document.getElementById('legendPanel');
        legendOffsetX = e.clientX - panel.offsetLeft;
        legendOffsetY = e.clientY - panel.offsetTop;
        document.addEventListener('mousemove', dragLegend);
        document.addEventListener('mouseup', stopDragLegend);
    }
    
    function dragLegend(e) {
        if (!legendDragging) return;
        const panel = document.getElementById('legendPanel');
        panel.style.left = (e.clientX - legendOffsetX) + 'px';
        panel.style.top = (e.clientY - legendOffsetY) + 'px';
        panel.style.right = 'auto';
    }
    
    function stopDragLegend() {
        legendDragging = false;
        document.removeEventListener('mousemove', dragLegend);
        document.removeEventListener('mouseup', stopDragLegend);
    }
    
    function saveLayout() {
        const positions = {};
        nodes.forEach(node => {
            positions[node.id] = {
                x: network.getPosition(node.id).x,
                y: network.getPosition(node.id).y
            };
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
        
        const status = document.getElementById('saveStatus');
        status.textContent = '✓ Layout saved!';
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
    }
    
    function resetToSaved() {
        // Try localStorage first, then fall back to default layout
        const saved = localStorage.getItem(STORAGE_KEY);
        const positions = saved ? JSON.parse(saved) : DEFAULT_LAYOUT;
        
        nodes.forEach(node => {
            if (positions[node.id]) {
                network.moveNode(node.id, positions[node.id].x, positions[node.id].y);
            }
        });
        network.fit();
        
        const status = document.getElementById('saveStatus');
        status.textContent = saved ? '✓ Layout restored!' : '✓ Reset to default layout!';
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
    }
    
    function highlightWorkflow() {
        const select = document.getElementById('workflowSelect');
        const idx = select.value;
        const pathDiv = document.getElementById('workflowPath');
        const stepsP = document.getElementById('workflowSteps');
        
        // Use pyvis's global 'nodes' and 'edges' DataSets directly
        if (_savedNodes.length === 0) {
            console.log('Saved data not ready');
            return;
        }
        
        // Reset to original state by clearing and re-adding all data
        // Save current positions first
        const positions = {};
        nodes.forEach(node => {
            const pos = network.getPosition(node.id);
            positions[node.id] = { x: pos.x, y: pos.y };
        });
        
        // Clear and restore original data
        nodes.clear();
        edges.clear();
        nodes.add(_savedNodes.map(n => ({...n, x: positions[n.id]?.x, y: positions[n.id]?.y})));
        edges.add(_savedEdges.map(e => ({...e})));
        
        if (idx === '') {
            pathDiv.style.display = 'none';
            _isHighlighting = false;
            return;
        }
        
        _isHighlighting = true;
        const workflow = workflows[parseInt(idx)];
        const steps = workflow.steps;
        
        // Show workflow path using short names (aliases)
        pathDiv.style.display = 'block';
        stepsP.innerHTML = steps.map((s, i) => {
            const displayName = shortNames[s] || s;
            const arrow = i < steps.length - 1 ? ' <span style="color: #10b981;">→</span> ' : '';
            return `<span style="background: rgba(59,130,246,0.1); padding: 2px 6px; border-radius: 4px;">${displayName}</span>${arrow}`;
        }).join('');
        
        // Dim all nodes not in workflow
        const stepsSet = new Set(steps);
        nodes.forEach(node => {
            if (!stepsSet.has(node.id)) {
                nodes.update({id: node.id, color: {background: 'rgba(100,100,100,0.3)', border: 'rgba(100,100,100,0.3)'}});
            }
        });
        
        // Dim all edges not in workflow
        const workflowEdges = new Set();
        for (let i = 0; i < steps.length - 1; i++) {
            workflowEdges.add(steps[i] + '->' + steps[i + 1]);
        }
        edges.forEach(edge => {
            const edgeKey = edge.from + '->' + edge.to;
            if (workflowEdges.has(edgeKey)) {
                edges.update({id: edge.id, color: {color: '#10b981'}, width: 4});
            } else {
                edges.update({id: edge.id, color: {color: 'rgba(100,100,100,0.15)'}, width: 0.5});
            }
        });
    }
    
    // Load saved layout on page load
    window.addEventListener('load', function() {
        // Store original data using pyvis's global 'nodes' and 'edges' DataSets
        setTimeout(function() {
            // Deep copy original node and edge data for reset
            nodes.forEach(node => {
                _savedNodes.push(JSON.parse(JSON.stringify(node)));
            });
            edges.forEach(edge => {
                _savedEdges.push(JSON.parse(JSON.stringify(edge)));
            });
            
            // Load layout: first try localStorage (user's personal saved layout),
            // then fall back to hardcoded DEFAULT_LAYOUT
            const saved = localStorage.getItem(STORAGE_KEY);
            const positions = saved ? JSON.parse(saved) : DEFAULT_LAYOUT;
            
            nodes.forEach(node => {
                if (positions[node.id]) {
                    network.moveNode(node.id, positions[node.id].x, positions[node.id].y);
                }
            });
            network.fit();
        }, 500);
    });
    </script>
