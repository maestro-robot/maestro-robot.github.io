    // Store original node/edge data for reset (prefixed to avoid pyvis conflicts)
    let _savedNodes = [];
    let _savedEdges = [];
    let _isHighlighting = false;

    // Legend drag state
    let legendDragging = false;
    let legendOffsetX = 0, legendOffsetY = 0;

    function toggleControls() {
        const panel = document.getElementById('controlPanel');
        const btn = document.getElementById('showControlsBtn');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            btn.style.display = 'none';
        } else {
            panel.style.display = 'none';
            btn.style.display = 'block';
        }
    }

    function toggleLegend() {
        const panel = document.getElementById('legendPanel');
        const btn = document.getElementById('showLegendBtn');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            btn.style.display = 'none';
        } else {
            panel.style.display = 'none';
            btn.style.display = 'block';
        }
    }

    function startDragLegend(e) {
        if (e.target.tagName === 'BUTTON') return;
        legendDragging = true;
        const panel = document.getElementById('legendPanel');
        legendOffsetX = e.clientX - panel.offsetLeft;
        legendOffsetY = e.clientY - panel.offsetTop;
        document.addEventListener('mousemove', dragLegend);
        document.addEventListener('mouseup', stopDragLegend);
    }

    function dragLegend(e) {
        if (!legendDragging) return;
        const panel = document.getElementById('legendPanel');
        panel.style.left = (e.clientX - legendOffsetX) + 'px';
        panel.style.top = (e.clientY - legendOffsetY) + 'px';
        panel.style.right = 'auto';
    }

    function stopDragLegend() {
        legendDragging = false;
        document.removeEventListener('mousemove', dragLegend);
        document.removeEventListener('mouseup', stopDragLegend);
    }

    function saveLayout() {
        const positions = {};
        nodes.forEach(node => {
            positions[node.id] = {
                x: network.getPosition(node.id).x,
                y: network.getPosition(node.id).y
            };
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));

        const status = document.getElementById('saveStatus');
        status.textContent = 'Layout saved!';
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
    }

    function resetToSaved() {
        // Try localStorage first, then fall back to default layout
        const saved = localStorage.getItem(STORAGE_KEY);
        const positions = saved ? JSON.parse(saved) : DEFAULT_LAYOUT;

        nodes.forEach(node => {
            if (positions[node.id]) {
                network.moveNode(node.id, positions[node.id].x, positions[node.id].y);
            }
        });
        network.fit();

        const status = document.getElementById('saveStatus');
        status.textContent = saved ? 'Layout restored!' : 'Reset to default layout!';
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
    }

    // ========== Task filter ==========
    function onTaskChange() {
        const taskName = document.getElementById('taskSelect').value;
        const td = TASK_DATA[taskName];

        // Save current node positions
        const positions = {};
        nodes.forEach(node => {
            const pos = network.getPosition(node.id);
            positions[node.id] = { x: pos.x, y: pos.y };
        });

        // Fallback positions from saved layout or default
        const savedLayout = localStorage.getItem(STORAGE_KEY);
        const fallbackPositions = savedLayout ? JSON.parse(savedLayout) : DEFAULT_LAYOUT;

        // Build new nodes (only functions that appear in this task)
        const callCounts = td.call_counts;
        const maxCount = Math.max(...Object.values(callCounts));
        const newNodes = [];
        for (const [funcId, count] of Object.entries(callCounts)) {
            const cat = funcCategories[funcId] || 'other';
            const color = catColors[cat] || '#999999';
            const label = shortNames[funcId] || funcId;
            const size = 15 + 35 * (count / maxCount);
            const pos = positions[funcId] || fallbackPositions[funcId] || { x: 0, y: 0 };
            newNodes.push({
                id: funcId,
                label: label,
                color: color,
                size: size,
                shape: 'dot',
                font: { color: '#333333' },
                title: label + '\nCategory: ' + cat + '\nCalls: ' + count,
                x: pos.x,
                y: pos.y
            });
        }

        // Build new edges
        const transitions = td.transitions;
        const maxTrans = Math.max(...Object.values(transitions));
        const newEdges = [];
        for (const [key, count] of Object.entries(transitions)) {
            const parts = key.split('->');
            const from = parts[0];
            const to = parts[1];
            const fromLabel = shortNames[from] || from;
            const toLabel = shortNames[to] || to;
            newEdges.push({
                from: from,
                to: to,
                value: count,
                width: 2 + 8 * (count / maxTrans),
                arrows: 'to',
                title: fromLabel + ' \u2192 ' + toLabel + ': ' + count
            });
        }

        // Update the graph
        nodes.clear();
        edges.clear();
        nodes.add(newNodes);
        edges.add(newEdges);

        // Update saved state for workflow highlighting
        _savedNodes = newNodes.map(n => JSON.parse(JSON.stringify(n)));
        _savedEdges = newEdges.map(e => JSON.parse(JSON.stringify(e)));

        // Update stats text
        document.getElementById('statsText').textContent =
            td.num_trials + ' trials \u2022 ' + td.total_calls + ' function calls';

        // Reset workflow highlight
        document.getElementById('workflowSelect').value = '';
        document.getElementById('workflowPath').style.display = 'none';
        _isHighlighting = false;

        // Disable workflow selector for per-task views (workflows are global patterns)
        document.getElementById('workflowSelect').disabled = (taskName !== 'All Tasks');

        network.fit();
    }

    // ========== Workflow highlight ==========
    function highlightWorkflow() {
        const select = document.getElementById('workflowSelect');
        const idx = select.value;
        const pathDiv = document.getElementById('workflowPath');
        const stepsP = document.getElementById('workflowSteps');

        // Use pyvis's global 'nodes' and 'edges' DataSets directly
        if (_savedNodes.length === 0) {
            console.log('Saved data not ready');
            return;
        }

        // Reset to original state by clearing and re-adding all data
        // Save current positions first
        const positions = {};
        nodes.forEach(node => {
            const pos = network.getPosition(node.id);
            positions[node.id] = { x: pos.x, y: pos.y };
        });

        // Clear and restore original data
        nodes.clear();
        edges.clear();
        nodes.add(_savedNodes.map(n => ({...n, x: positions[n.id]?.x, y: positions[n.id]?.y})));
        edges.add(_savedEdges.map(e => ({...e})));

        if (idx === '') {
            pathDiv.style.display = 'none';
            _isHighlighting = false;
            return;
        }

        _isHighlighting = true;
        const workflow = workflows[parseInt(idx)];
        const steps = workflow.steps;

        // Show workflow path using short names (aliases)
        pathDiv.style.display = 'block';
        stepsP.innerHTML = steps.map((s, i) => {
            const displayName = shortNames[s] || s;
            const arrow = i < steps.length - 1 ? ' <span style="color: #10b981;">\u2192</span> ' : '';
            return '<span style="background: rgba(59,130,246,0.1); padding: 2px 6px; border-radius: 4px;">' + displayName + '</span>' + arrow;
        }).join('');

        // Dim all nodes not in workflow
        const stepsSet = new Set(steps);
        nodes.forEach(node => {
            if (!stepsSet.has(node.id)) {
                nodes.update({id: node.id, color: {background: 'rgba(100,100,100,0.3)', border: 'rgba(100,100,100,0.3)'}});
            }
        });

        // Dim all edges not in workflow
        const workflowEdges = new Set();
        for (let i = 0; i < steps.length - 1; i++) {
            workflowEdges.add(steps[i] + '->' + steps[i + 1]);
        }
        edges.forEach(edge => {
            const edgeKey = edge.from + '->' + edge.to;
            if (workflowEdges.has(edgeKey)) {
                edges.update({id: edge.id, color: {color: '#10b981'}, width: 4});
            } else {
                edges.update({id: edge.id, color: {color: 'rgba(100,100,100,0.15)'}, width: 0.5});
            }
        });
    }

    // Load saved layout on page load
    window.addEventListener('load', function() {
        // Store original data using pyvis's global 'nodes' and 'edges' DataSets
        setTimeout(function() {
            // Deep copy original node and edge data for reset
            nodes.forEach(node => {
                _savedNodes.push(JSON.parse(JSON.stringify(node)));
            });
            edges.forEach(edge => {
                _savedEdges.push(JSON.parse(JSON.stringify(edge)));
            });

            // Load layout: first try localStorage (user's personal saved layout),
            // then fall back to hardcoded DEFAULT_LAYOUT
            const saved = localStorage.getItem(STORAGE_KEY);
            const positions = saved ? JSON.parse(saved) : DEFAULT_LAYOUT;

            nodes.forEach(node => {
                if (positions[node.id]) {
                    network.moveNode(node.id, positions[node.id].x, positions[node.id].y);
                }
            });
            network.fit();
        }, 500);
    });
